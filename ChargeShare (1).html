<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ChargeShare</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#0b1b33;--mu:#5b6b80;--nv:#0b1b33;--em:#10b981;--bd:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13233b;--tx:#e8eef6;--mu:#94a3b8;--bd:#25374f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{background:#0b1b33;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:20px;cursor:pointer}.logo b{color:var(--em)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}nav button{background:none;border:0;color:#cbd5e1;padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}nav button.on,nav button:hover{background:#1e3352;color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{font-size:26px;font-weight:800;color:var(--em)}.mu{color:var(--mu);font-size:13px}
button.b,a.b{background:var(--em);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.b.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.b.r{background:#dc2626}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e2e8f0;color:#0b1b33}.tag.ok{background:#d1fae5;color:#065f46}.tag.w{background:#fef3c7;color:#92400e}.tag.x{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--bd)}.sc{overflow-x:auto}
.hero{background:linear-gradient(135deg,#0b1b33,#0f3d3a);color:#fff;border-radius:18px;padding:40px 24px;text-align:center}.hero h1{font-size:clamp(26px,6vw,42px);margin:0 0 8px}.big{font-size:17px;padding:13px 22px;margin:4px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0b1b33;color:#fff;padding:10px 18px;border-radius:10px;z-index:20}
.pt{cursor:pointer}.pt:hover{border-color:var(--em)}
.warn{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px;font-size:13px}
svg text{font-family:inherit}
</style></head><body>
<header><span class="logo" onclick="go(U?home():'land')">⚡Charge<b>Share</b></span><nav id="nav"></nav></header>

 u.push({id:'a1',role:'admin',name:'Admin Demo',email:'admin@demo.cs',mob:'9000000300',pw,city:'Rajahmundry',state:'Andhra Pradesh'});
 const pn=[['Green Porch Charger','h1','Rajahmundry',17.0035,81.8095,12,7.4,'AC','Type 2'],['Godavari EV Hub','h2','Kakinada',16.9925,82.2441,14,7.4,'AC','Type 2'],['Surampalem Quick Plug','h3','Surampalem',17.0905,82.0585,18,15,'DC','CCS2'],['Peddapuram Home Bay','h4','Peddapuram',17.0742,82.1425,11,3.3,'AC','Type 2'],['Samalkot Sun Charger','h5','Samalkot',17.0555,82.1702,13,7.4,'AC','Type 2'],['Lakeside Garage','h1','Rajahmundry',16.9968,81.7962,15,11,'AC','Type 2'],['Coastal EV Point','h2','Kakinada',16.9855,82.2512,20,22,'DC','CCS2'],['Temple Road Plug','h4','Peddapuram',17.0811,82.1358,10,3.3,'AC','Type 2']];
 const pts=pn.map((p,i)=>({id:'p'+(i+1),n:p[0],h:p[1],t:p[2],lat:p[3],lon:p[4],pr:p[5],kw:p[6],ty:p[7],cn:p[8],park:i%3?'Covered parking, 1 car':'Open driveway, 2 cars',a:[7,21],min:1,max:4,days:'Mon–Sun',paused:0,load:'5 kW single phase',inst:'Dedicated EVSE, installed by licensed electrician'}));
 const st=['completed','completed','completed','completed','completed','pending','pending','accepted','confirmed','rejected'];
 const bk=st.map((s,i)=>{const p=pts[i%8],kwh=+(8+i*2.1).toFixed(1);return{id:'BK'+(1001+i),pt:p.id,o:'o'+(i%5+1),d:s=='completed'?dt(-(i*2+1)):dt(i-3),s:8+i,du:2,tg:80,kwh,amt:+(kwh*p.pr).toFixed(2),st:s,paid:s=='completed'||s=='confirmed',tx:s=='completed'||s=='confirmed'?'TXN'+(77000+i):''}});
 const rv=[['BK1001','o1',5,'Easy to find and very helpful host.'],['BK1002','o2',4,'Good price, charger worked well.'],['BK1003','o3',5,'Safe setup, clean parking.'],['BK1004','o4',4,'Slightly slow but fair rate.'],['BK1005','o5',3,'Host was late to open the gate.']].map((r,i)=>({id:'R'+i,b:r[0],o:r[1],s:r[2],t:r[3],rep:''}));
 S={users:u,pts,bk,rv,notes:[],reports:[{id:'RP1',by:'o3',t:'Host asked for extra cash fee (demo report)',st:'open'}],fee:5,ses:null};save()}
function home(){return U.role=='owner'?'find':U.role=='host'?'hd':'ad'}
const usr=id=>S.users.find(u=>u.id==id),pt=id=>S.pts.find(p=>p.id==id);
const rate=h=>{const r=S.rv.filter(x=>pt(S.bk.find(b=>b.id==x.b)?.pt)?.h==h);return r.length?r.reduce((a,x)=>a+x.s,0)/r.length:0};
const vst=h=>{const n=Object.values(usr(h).v).filter(Boolean).length;return n==5?['Verified (demo)','ok']:n>=2?['Pending','w']:['Unverified','x']};
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,k=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(k))};
const dist=p=>{const l=F.gps||TOWNS[F.loc];return hav(l[0],l[1],p.lat,p.lon)};
const notify=(to,m)=>{S.notes.unshift({to,m,t:new Date().toLocaleString(),r:0})};
const fee=a=>+(a*S.fee/100).toFixed(2);
function go(v,p){V=v;P=p;R();scrollTo(0,0)}
const TABS={owner:[['sos','🆘 Rescue'],['find','Find'],['calc','Calculator'],['bk','Bookings'],['veh','Vehicle'],['chat','Chat'],['alerts','Alerts'],['prof','Profile'],['help','Help']],host:[['hd','Dashboard'],['pts','Charging points'],['rev','Reviews'],['chat','Chat'],['alerts','Alerts'],['prof','Profile'],['help','Help']],admin:[['ad','Admin'],['prof','Profile']]};
function R(){S.chats=S.chats||[];
 const n=$('#nav');
 if(!U)n.innerHTML=`<button onclick="go('land')">Home</button><button onclick="go('about')">About</button><button onclick="go('login')">Login</button><button onclick="go('reg')">Register</button>`;
 else{const c=S.notes.filter(x=>x.to==U.id&&!x.r).length;n.innerHTML=TABS[U.role].map(t=>`<button class="${V==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}${t[0]=='alerts'&&c?' ('+c+')':''}</button>`).join('')+`<button onclick="out()">Logout</button>`}
 $('#m').innerHTML=(VIEWS[V]||VIEWS.land)();if(V=='calc')calc();if(V=='det'&&BK){const v=(U.veh||[])[0];window.BC=v&&VEH[v.m]?VEH[v.m][0]:40;bq()}
}
const out=()=>{U=null;S.ses=null;save();go('land')};
const VIEWS={
land:()=>LAND(),
land0:()=>`<div class="hero"><h1>⚡ ChargeShare</h1><p style="font-size:18px">Your Neighbourhood is Your Charging Network.</p><p>EV owners find safe home chargers nearby. Homeowners with proper EV chargers earn money.</p><button class="b" onclick="go('reg')">Get started</button> <button class="b s" onclick="go('login')">Try demo login</button></div>
<div class="g g2" style="margin-top:14px">${[['🔍','Find nearby','Map and list of home chargers with price, power and rating.'],['🧮','Know the cost','Calculator shows energy, time, cost and range gained.'],['💰','Earn as a host','Set your price, accept requests and track earnings.']].map(x=>`<div class="card"><div style="font-size:28px">${x[0]}</div><b>${x[1]}</b><div class="mu">${x[2]}</div></div>`).join('')}</div>`,
about:()=>`<div class="card"><h2>About ChargeShare</h2><p>ChargeShare connects EV owners who need a charge with homeowners who have a dedicated, safely installed EV charger. Host locations stay approximate until a booking is accepted.</p><div class="warn">Safety: an ordinary home socket is not a safe way to charge every EV. Hosts must use a dedicated EV charger (EVSE) installed by a qualified electrician. This is a college prototype: payments are simulated and "verified" badges on demo accounts are not real verification.</div></div>`,
login:()=>`<div class="card" style="max-width:420px;margin:auto"><h2>Login</h2><label>Email or mobile</label><input id="li"><label>Password</label><input id="lp" type="password"><label><input type="checkbox" id="rm" style="width:auto"> Remember me <span style="float:right"><input type="checkbox" style="width:auto" onclick="lp.type=this.checked?'text':'password'"> Show</span></label><br><button class="b" onclick="login()">Login</button> <button class="b s" onclick="toast('Demo: a reset link would be sent to your email')">Forgot password</button>
<div class="warn" style="margin-top:14px"><b>Demo accounts</b> (fictional), password <b>Demo@123</b><br>
<button class="b s" onclick="fill('owner1@demo.cs')">EV owner</button> <button class="b s" onclick="fill('host1@demo.cs')">Host</button> <button class="b s" onclick="fill('admin@demo.cs')">Admin</button><br>owner1@demo.cs · host1@demo.cs · admin@demo.cs</div></div>`,
reg:()=>`<div class="card" style="max-width:560px;margin:auto"><h2>Create account</h2><div class="g g2"><div><label>Full name</label><input id="rn"></div><div><label>Account type</label><select id="rr"><option value="owner">EV Owner</option><option value="host">Homeowner / Host</option></select></div><div><label>Email</label><input id="re" type="email"></div><div><label>Mobile (+91)</label><input id="rm" maxlength="10" placeholder="10 digits"></div><div><label>Password (min 8)</label><input id="rp" type="password"></div><div><label>Confirm password</label><input id="rc" type="password"></div><div><label>State</label><input id="rs" value="Andhra Pradesh"></div><div><label>District</label><input id="rd" value="East Godavari"></div><div><label>City / Town</label><select id="rt">${Object.keys(TOWNS).map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>PIN code</label><input id="rz" maxlength="6"></div><div><label>Date of birth (optional)</label><input id="rb" type="date"></div><div><label>Gender (optional)</label><select id="rg"><option></option><option>Female</option><option>Male</option><option>Other</option></select></div></div><label>Profile photo</label><input type="file" id="rf" accept="image/*"><br><button class="b" onclick="reg()">Register</button></div>`,
find:()=>{const L=list();return `<h2>Find a charger</h2><div class="card"><div class="g g4"><div><label>Your location</label><select onchange="F.gps=0;F.loc=this.value;R()">${Object.keys(TOWNS).map(t=>`<option ${F.loc==t&&!F.gps?'selected':''}>${t}</option>`).join('')}</select><button class="b s" style="margin-top:4px;width:100%" onclick="gps()">Use my GPS</button></div>
<div><label>Distance (km)</label><select onchange="F.r=+this.value;R()">${[2,5,10,20,50].map(x=>`<option ${F.r==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Max ₹/kWh</label><input type="number" value="${F.max}" onchange="F.max=+this.value;R()"></div>
<div><label>Type</label><select onchange="F.t=this.value;R()"><option value="">AC or DC</option><option ${F.t=='AC'?'selected':''}>AC</option><option ${F.t=='DC'?'selected':''}>DC</option></select></div><div><label>Connector</label><select onchange="F.c=this.value;R()"><option value="">Any</option><option ${F.c=='Type 2'?'selected':''}>Type 2</option><option ${F.c=='CCS2'?'selected':''}>CCS2</option></select></div><div><label>Min rating</label><select onchange="F.rat=+this.value;R()">${[0,3,4,4.5].map(x=>`<option ${F.rat==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
<label style="display:inline"><input type="checkbox" style="width:auto" ${F.now?'checked':''} onchange="F.now=+this.checked;R()"> Available now</label> &nbsp; <label style="display:inline"><input type="checkbox" style="width:auto" ${F.ver?'checked':''} onchange="F.ver=+this.checked;R()"> Verified hosts only</label> &nbsp; <button class="b s" onclick="F.view='map';R()">Map</button> <button class="b s" onclick="F.view='list';R()">List</button></div>
${L[0]?`<div class="card"><b>⭐ Best match:</b> ${L[0].n} — ${dist(L[0]).toFixed(1)} km, ₹${L[0].pr}/kWh, ${L[0].kw} kW <span class="mu">(score uses distance, price, connector and availability)</span> <button class="b" onclick="go('det','${L[0].id}')">View</button></div>`:'<div class="card">No charging points match these filters.</div>'}
${F.view=='map'?mapSvg(L):''}<div class="g g2">${L.map(card).join('')}</div>
<div class="card"><h3>Public station comparison (illustrative)</h3><p class="mu">Typical public fast-charging tariffs are around ₹18–24/kWh. Home hosts here: ₹${Math.min(...S.pts.map(p=>p.pr))}–${Math.max(...S.pts.map(p=>p.pr))}/kWh. Check actual tariffs before you travel.</p></div>`},
det:()=>{const p=pt(P),h=usr(p.h),v=vst(h.id),rv=S.rv.filter(r=>S.bk.find(b=>b.id==r.b)?.pt==p.id);
 const bk=S.bk.find(b=>b.pt==p.id&&b.o==U.id&&['accepted','confirmed'].includes(b.st));const fv=(U.fav||[]).includes(p.id);
 return `<button class="b s" onclick="go('find')">← Back</button><div class="card" style="margin-top:10px"><h2>${p.n} ${p.paused?'<span class="tag x">Paused</span>':''}</h2><p>Host: <b>${h.name}</b> <span class="tag ${v[1]}">${v[0]}</span> ⭐ ${rate(h.id)?rate(h.id).toFixed(1):'New'}</p>
<div class="g g4"><div><div class="stat">₹${p.pr}</div><div class="mu">per kWh</div></div><div><div class="stat">${p.kw} kW</div><div class="mu">${p.ty} · ${p.cn}</div></div><div><div class="stat">${dist(p).toFixed(1)} km</div><div class="mu">approx. distance</div></div><div><div class="stat">${p.a[0]}:00–${p.a[1]}:00</div><div class="mu">${p.days}</div></div></div>
<p>🅿 ${p.park}<br>🔌 ${p.load} · ${p.inst}<br>📍 Approximate area: near ${p.t}. ${bk?`<b>Exact address:</b> ${h.addr}`:'Exact address is shared only after your booking is accepted.'}</p>
<a class="b s" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?to=${p.lat.toFixed(2)},${p.lon.toFixed(2)}">Directions (approx. area)</a> <button class="b s" onclick="fav('${p.id}')">${fv?'♥ Saved':'♡ Save'}</button> <button class="b" ${p.paused?'disabled':''} onclick="BK=1;R()">Book this charger</button> <button class="b s" onclick="openChat('${p.h}')">💬 Chat with host</button></div>
${BK?bookForm(p):''}<div class="card"><h3>Reviews</h3>${rv.map(r=>`<p>${'★'.repeat(r.s)}${'☆'.repeat(5-r.s)} ${r.t}<br>${r.rep?`<span class="mu">Host: ${r.rep}</span>`:''}</p>`).join('')||'<p class="mu">No reviews yet.</p>'}</div>`},
calc:()=>{const m=P&&VEH[P]?P:'Tata Nexon EV';return `<h2>Charging cost calculator</h2><div class="card"><div class="g g4"><div><label>Vehicle</label><select id="cm" onchange="P=this.value;R()">${Object.keys(VEH).map(k=>`<option ${k==m?'selected':''}>${k}</option>`).join('')}</select></div><div><label>Battery (kWh)</label><input id="cb" type="number" value="${VEH[m][0]}" oninput="calc()"></div><div><label>Current %</label><input id="cc" type="number" value="20" oninput="calc()"></div><div><label>Target %</label><input id="ct" type="number" value="80" oninput="calc()"></div><div><label>Price ₹/kWh</label><input id="cp" type="number" value="12" oninput="calc()"></div><div><label>Efficiency %</label><input id="ce" type="number" value="90" oninput="calc()"></div><div><label>Charger kW</label><input id="ck" type="number" value="${Math.min(VEH[m][2],7.4)}" oninput="calc()"></div></div><div id="co"></div></div><div class="card"><h3>Compare hosts for this charge</h3><div id="cmp" class="sc"></div></div>`},
bk:()=>{const mine=U.role=='owner'?S.bk.filter(b=>b.o==U.id):S.bk.filter(b=>pt(b.pt).h==U.id);const sp=mine.filter(b=>b.paid).reduce((a,b)=>a+b.amt+fee(b.amt),0);
 return `<h2>Booking history</h2><div class="card">Total spent on charging: <b>₹${sp.toFixed(2)}</b> · Energy: <b>${mine.filter(b=>b.st=='completed').reduce((a,b)=>a+b.kwh,0).toFixed(1)} kWh</b> · CO₂ avoided ≈ <b>${co2(mine.filter(b=>b.st=='completed').reduce((a,b)=>a+b.kwh,0))} kg</b><div class="mu">Assumes EV uses 7 km/kWh, grid emits 0.71 kg CO₂/kWh, petrol car 0.12 kg CO₂/km. Estimate only.</div></div><div class="card sc"><table><tr><th>ID</th><th>Point</th><th>Date</th><th>Time</th><th>kWh</th><th>Amount</th><th>Status</th><th></th></tr>${mine.map(bkRow).join('')||'<tr><td colspan=8>No bookings</td></tr>'}</table></div>`},
